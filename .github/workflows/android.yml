name: Android

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish as a GitHub release (e.g. 1.0.2 or 1.1.0-beta.1). Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # GitHub runners ship the Android SDK; only the newest platform needs installing.
      - name: Install SDK packages
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v5

      # Tags v1.2.3 / v1.3.0-beta.1, or the "release" input of a manual run, become the app version.
      - name: Version
        id: ver
        env:
          INPUT_RELEASE: ${{ github.event.inputs.release }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_RELEASE" ]; then
            echo "name=${INPUT_RELEASE#v}" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=1.0.0" >> "$GITHUB_OUTPUT"; echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      # Private release key from repository secrets. Tags refuse to build without it,
      # so a release can never be signed with anything else.
      - name: Release signing
        id: sign
        env:
          KEYSTORE_B64: ${{ secrets.WIDAPP_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "WIDAPP_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.ver.outputs.publish }}" = "true" ]; then
            echo "::error::Add the WIDAPP_KEYSTORE_BASE64, WIDAPP_KEYSTORE_PASSWORD, WIDAPP_KEY_ALIAS and WIDAPP_KEY_PASSWORD secrets to publish releases."
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --tests "app.widapp.SpecTest" -PappVersion=${{ steps.ver.outputs.name }}

      - name: Build APKs
        env:
          WIDAPP_KEYSTORE_PASSWORD: ${{ secrets.WIDAPP_KEYSTORE_PASSWORD }}
          WIDAPP_KEY_ALIAS: ${{ secrets.WIDAPP_KEY_ALIAS }}
          WIDAPP_KEY_PASSWORD: ${{ secrets.WIDAPP_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease -PappVersion=${{ steps.ver.outputs.name }}

      - name: Name APK
        run: |
          mkdir -p dist
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/WidApp-${{ steps.ver.outputs.name }}.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "dist/WidApp-${{ steps.ver.outputs.name }}-debug.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: WidApp-${{ steps.ver.outputs.name }}
          path: dist/*

      - name: Release notes
        id: notes
        run: |
          f="release-notes/${{ steps.ver.outputs.name }}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; fi

      # The app's OTA updater reads GitHub Releases and installs the attached APK.
      - name: Publish release
        if: steps.ver.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          # Only the release-signed APK goes to Releases; OTA installs exactly this file.
          files: |
            dist/WidApp-${{ steps.ver.outputs.name }}.apk
            dist/SHA256SUMS.txt
          name: WidApp ${{ steps.ver.outputs.name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.ver.outputs.name, '-') }}
